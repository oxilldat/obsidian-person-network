name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const m=require('./manifest.json'); if (m.version !== process.env.TAG) { console.error('Tag must equal manifest version'); process.exit(1) }"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
            gh release edit "$TAG" --title "$TAG"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes main.js manifest.json styles.css
          fi
